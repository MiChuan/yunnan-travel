<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路书 · 七彩云南环线</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="top">
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">🌸 七彩云南环线</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">首页</a>
        <a href="routebook.html" class="nav-link active">路书</a>
        <a href="checklist.html" class="nav-link">物资清单</a>
        <a href="food.html" class="nav-link">滇味食志</a>
        <a href="specialty.html" class="nav-link">特产文创</a>
        <a href="weather.html" class="nav-link">沿途天气</a>
        <a href="elevation.html" class="nav-link">海拔变化</a>
      </div>
    </div>
  </nav>

  <main class="page-wrap">
    <header class="page-header">
      <h1>📍 路书</h1>
      <p id="routeSubtitle">8 天全程路线与每日行程</p>
    </header>

    <div class="view-toggle">
      <button class="view-btn active" data-view="overview">全程概览</button>
      <button class="view-btn" data-view="daily">逐日详情</button>
    </div>

    <div id="overviewView" class="card card-body overview-section">
      <h2>全程时间线</h2>
      <div class="timeline" id="timeline"></div>
    </div>

    <div id="dailyView" class="route-layout" style="display:none;">
      <aside class="card day-sidebar">
        <div class="day-sidebar-title">选择日期</div>
        <div id="dayNav"></div>
      </aside>
      <div class="card" id="dayDetails"></div>
    </div>

    <div class="external-links" id="externalLinks" style="margin-top:24px;"></div>
  </main>

  <footer class="site-footer">
    <p>点击时间线或侧边栏切换日期 · Ctrl+P 可打印</p>
  </footer>

  <div class="float-actions" id="floatActions" aria-label="快捷导航">
    <a href="#top" class="float-btn" title="返回顶部" aria-label="返回顶部">↑</a>
    <a href="index.html" class="float-btn float-btn-home" title="返回首页" aria-label="返回首页">🏠</a>
  </div>

  <script src="js/floatnav.js"></script>
  <script src="js/routebook.js"></script>
</body>
</html>
